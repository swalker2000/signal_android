<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Круглые циферблаты</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07090d;
            color: #e7edf3;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .screen {
            height: 100%;
            display: grid;
            grid-template-columns: minmax(72px, 9vw) 1fr minmax(72px, 9vw);
            align-items: stretch;
            padding: 2vh 1.2vw;
            background:
                radial-gradient(ellipse at 50% 40%, #1a212b 0%, #07090d 68%);
        }

        .turn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2a313a;
        }

        .turn svg {
            width: min(9vw, 18vh);
            height: auto;
        }

        .turn.on {
            color: #ffc107;
            animation: blink 0.72s steps(1, end) infinite;
            filter: drop-shadow(0 0 14px rgba(255, 193, 7, 0.85));
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.08; }
        }

        .main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4vw;
            min-height: 12vh;
        }

        .lights {
            display: flex;
            align-items: center;
            gap: 0.6vw;
            color: #3a4350;
            min-width: 18vw;
        }

        .lights svg { width: 4.2vh; height: 4.2vh; }
        .lights span { font-size: 2.2vh; letter-spacing: 0.04em; }

        .lights.l1 { color: #7dcea0; }
        .lights.l2 { color: #f4f7fb; }
        .lights.l3 { color: #4da3ff; }

        .gear {
            font-size: 9vh;
            font-weight: 720;
            line-height: 0.9;
            letter-spacing: 0.04em;
            min-width: 1.4ch;
            text-align: center;
        }

        .dials {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 1.15fr 1.15fr 0.92fr 0.92fr;
            gap: 1vw;
            align-items: center;
        }

        .dial {
            height: 100%;
            max-height: 78vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dial svg { width: 100%; height: 100%; }

        .face { fill: #141920; }
        .bezel { fill: none; stroke: #3c4654; stroke-width: 7; }
        .track { fill: none; stroke: rgba(255, 255, 255, 0.16); stroke-width: 7; stroke-linecap: butt; }
        .zone { fill: none; stroke: #e23b32; stroke-width: 7; stroke-linecap: butt; }
        .tick { stroke: #d5dde6; stroke-width: 2; stroke-linecap: round; }
        .tick.minor { stroke: rgba(213, 221, 230, 0.45); stroke-width: 1.4; }
        .tick-label { fill: #c5ced8; font-size: 11px; font-family: inherit; }
        .value { fill: #f4f7fb; font-size: 28px; font-weight: 700; font-family: inherit; }
        .unit { fill: #8b97a6; font-size: 11px; font-family: inherit; letter-spacing: 0.04em; }
        .needle { fill: #ffb300; }
        .needle.hot { fill: #ff4d3a; }
        .hub { fill: #0d1116; stroke: #ffb300; stroke-width: 2; }
        .needle.hot + .hub { stroke: #ff4d3a; }
    </style>
</head>
<body>
<div class="screen">
    <div class="turn" id="turn-left" aria-label="Левый поворот">
        <svg viewBox="0 0 80 100">
            <polyline points="72,16 40,50 72,84" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt"/>
            <polyline points="44,16 12,50 44,84" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt"/>
        </svg>
    </div>
    <div class="main">
        <div class="status">
            <div class="lights" id="lights">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M9 18h6M10 21h4"/>
                    <path d="M8 15a6 6 0 1 1 8 0"/>
                    <path d="M5 12H3M21 12h-2M6.2 6.2 4.8 4.8M19.2 4.8 17.8 6.2"/>
                </svg>
                <span id="lights-label">свет выкл</span>
            </div>
            <div class="gear" id="gear">—</div>
        </div>
        <div class="dials" id="dials"></div>
    </div>
    <div class="turn" id="turn-right" aria-label="Правый поворот">
        <svg viewBox="0 0 80 100">
            <polyline points="8,16 40,50 8,84" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt"/>
            <polyline points="36,16 68,50 36,84" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt"/>
        </svg>
    </div>
</div>
<script>
    const START = 135;
    const SWEEP = 270;
    const CX = 100;
    const CY = 100;

    const SPECS = {
        rpm: { min: 0, max: 12000, unit: "об/мин", redFrom: 10000, step: 2000, minor: 1000, format: (v) => String(Math.round(v / 1000)) },
        speed: { min: 0, max: 240, unit: "км/ч", redFrom: null, step: 40, minor: 20, format: (v) => String(Math.round(v)) },
        temp: { min: 40, max: 140, unit: "°C", redFrom: 110, step: 20, minor: 10, format: (v) => String(Math.round(v)) },
        fuel: { min: 0, max: 100, unit: "бак", redTo: 15, step: 25, minor: 0, format: (v) => String(Math.round(v)) }
    };

    const gauges = {};

    function pt(r, deg) {
        const rad = deg * Math.PI / 180;
        return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
    }

    function arc(r, a0, a1) {
        const [x0, y0] = pt(r, a0);
        const [x1, y1] = pt(r, a1);
        const large = (a1 - a0) > 180 ? 1 : 0;
        return "M " + x0 + " " + y0 + " A " + r + " " + r + " 0 " + large + " 1 " + x1 + " " + y1;
    }

    function angleOf(spec, value) {
        const t = Math.min(1, Math.max(0, (value - spec.min) / (spec.max - spec.min)));
        return START + t * SWEEP;
    }

    function build(id, spec) {
        const zone = spec.redFrom != null
            ? arc(78, angleOf(spec, spec.redFrom), angleOf(spec, spec.max))
            : (spec.redTo != null ? arc(78, angleOf(spec, spec.min), angleOf(spec, spec.redTo)) : "");
        const wrap = document.createElement("div");
        wrap.className = "dial";
        wrap.innerHTML =
            '<svg viewBox="0 0 200 200">' +
            '<circle class="face" cx="100" cy="100" r="90"/>' +
            '<circle class="bezel" cx="100" cy="100" r="90"/>' +
            '<path class="track" d="' + arc(78, START, START + SWEEP) + '"/>' +
            (zone ? '<path class="zone" d="' + zone + '"/>' : "") +
            '<g class="ticks"></g>' +
            '<text class="value" x="100" y="118" text-anchor="middle">—</text>' +
            '<text class="unit" x="100" y="136" text-anchor="middle">' + spec.unit + '</text>' +
            '<g class="needle"><polygon points="100,100 95,104 164,100 95,96"/></g>' +
            '<circle class="hub" cx="100" cy="100" r="7"/>' +
            '</svg>';
        const svg = wrap.querySelector("svg");
        const ticks = svg.querySelector(".ticks");
        const minor = spec.minor > 0 ? spec.minor : spec.step;
        for (let value = spec.min; value <= spec.max + 0.001; value += minor) {
            const major = Math.abs((value - spec.min) % spec.step) < 0.001 || Math.abs(value - spec.max) < 0.001;
            const deg = angleOf(spec, value);
            const [x0, y0] = pt(major ? 70 : 74, deg);
            const [x1, y1] = pt(84, deg);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("class", major ? "tick" : "tick minor");
            line.setAttribute("x1", x0);
            line.setAttribute("y1", y0);
            line.setAttribute("x2", x1);
            line.setAttribute("y2", y1);
            ticks.appendChild(line);
            if (major) {
                const [lx, ly] = pt(58, deg);
                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("class", "tick-label");
                label.setAttribute("x", lx);
                label.setAttribute("y", ly);
                label.setAttribute("text-anchor", "middle");
                label.setAttribute("dominant-baseline", "middle");
                label.textContent = spec.format(value);
                ticks.appendChild(label);
            }
        }
        document.getElementById("dials").appendChild(wrap);
        gauges[id] = { spec: spec, needle: svg.querySelector(".needle"), value: svg.querySelector(".value") };
        setGauge(id, null);
    }

    function setGauge(id, raw) {
        const gauge = gauges[id];
        if (!gauge) return;
        const spec = gauge.spec;
        const missing = raw == null || Number.isNaN(Number(raw));
        const value = missing ? spec.min : Number(raw);
        const hot = !missing && (
            (spec.redFrom != null && value >= spec.redFrom) ||
            (spec.redTo != null && value <= spec.redTo)
        );
        gauge.needle.setAttribute("transform", "rotate(" + angleOf(spec, value) + " 100 100)");
        gauge.needle.classList.toggle("hot", hot);
        gauge.value.textContent = missing ? "—" : String(Math.round(value));
    }

    function setGear(gear) {
        const text = gear == null || gear === "" ? "—" : String(gear);
        document.getElementById("gear").textContent = text;
    }

    function setLights(level) {
        const value = level == null ? 0 : Number(level);
        const el = document.getElementById("lights");
        el.className = "lights l" + (value > 0 ? value : 0);
        const labels = ["свет выкл", "габариты", "ближний", "дальний"];
        document.getElementById("lights-label").textContent = labels[value] || labels[0];
    }

    function setTurn(id, on) {
        document.getElementById(id).classList.toggle("on", !!on);
    }

    Object.keys(SPECS).forEach((id) => build(id, SPECS[id]));

    window.updateRpm = function (rpm) { setGauge("rpm", rpm); };
    window.updateMetrics = function (speed, gear, temp, fuel) {
        setGauge("speed", speed);
        setGear(gear);
        setGauge("temp", temp);
        setGauge("fuel", fuel);
    };
    window.onSignalData = function (data) {
        if (!data) return;
        setGauge("rpm", data.rpm);
        setGauge("speed", data.speed);
        setGear(data.gear);
        setGauge("temp", data.temp);
        setGauge("fuel", data.fuel);
        setLights(data.lights);
        setTurn("turn-left", data.turnLeft);
        setTurn("turn-right", data.turnRight);
    };
</script>
</body>
</html>
